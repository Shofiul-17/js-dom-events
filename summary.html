<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Summary: Event Handlers</title>
</head>
<body>
    <h1>Explore DOM Events</h1>
    <!-- btn{Make Green} -->
    <button onclick="makeGreen()">Make Green</button>
    <!-- btn#make-tellow{Make Yellow} -->
    <button id="make-yellow">Make Yellow</button>
    <input id="user-email" type="gmail" placeholder="email">
    <script>
        function makeGreen(){
            document.body.style.backgroundColor = 'green';
        }

        /* ====== #1 ====== */
        /* const makeYellow = document.getElementById('make-yellow');
        makeYellow.addEventListener('click', function(){
            document.body.style.backgroundColor = 'yellow';
        }) */

       /* ====== Use #1 above Or use #2 below ====== */

       /* ====== #2 ====== */
        document.getElementById('make-yellow').addEventListener('click', function(){
            document.body.style.backgroundColor = 'yellow';
        })

        /* const userEmail = document.getElementById('user-email');
        userEmail.addEventListener('keyup', function(event){
            console.log("Input For Email Field Paichhe!");
            console.log(event.target.value);
        }) */

        document.getElementById('user-email').addEventListener('keyup', function(event){
            console.log(event.target.value);
        })
    </script>
    
</body>
</html>
